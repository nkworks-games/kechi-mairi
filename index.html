<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}</style>
<meta name="description" content="硬貨を3枚入れたら願いが叶う神社。ただし神様は、500円玉より安い硬貨をはたき落とす。神様をだまして、できるだけ安くお参りするゲーム。">
<meta name="theme-color" content="#2a120c">
<title>ケチ参り</title>
<meta property="og:type" content="website">
<meta property="og:title" content="ケチ参り">
<meta property="og:description" content="硬貨3枚で願いが叶う神社。でも神様は、500円より安い硬貨をはたき落とす。だまして、いくらで叶えられる？">
<meta property="og:url" content="https://nkworks-games.com/kechi-mairi/">
<meta property="og:image" content="https://nkworks-games.com/kechi-mairi/card.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@700;800;900&family=Shippori+Mincho+B1:wght@800&display=swap" rel="stylesheet">
<style>
/* ケチ参り：画面は「横360の縦長の舞台」1枚。画面の大きさに合わせて、舞台ごと拡大・縮小する（--s）。舞台の高さ（--h）は、縦長のスマホでは600〜800の間でのびる */
:root {
  color-scheme: dark;
  --ink: #2a1a12;          /* 線と文字（墨） */
  --paper: #fff6e2;        /* 紙・明るい地 */
  --wood: #b98045;         /* 木 */
  --wood-d: #7a4a22;       /* 濃い木 */
  --shu: #d8452b;          /* 朱色（主役の色） */
  --gold: #f2c14e;         /* 金 */
  --night: #1d0f0a;        /* 舞台の外 */
  --dim: #cdb99c;          /* 弱い文字 */
  --logo: "Dela Gothic One", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
  --body: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --fude: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
}
html { height: 100%; box-sizing: border-box; }
body { height: 100%; margin: 0; background: var(--night); color: var(--paper); font-family: var(--body); font-weight: 700; font-size: 14px; line-height: 1.5; overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; -webkit-appearance: none; appearance: none; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

#app { position: fixed; left: 50%; top: 50%; width: 360px; height: calc(var(--h, 640) * 1px); transform: translate(-50%, -50%) scale(var(--s, 1)); transform-origin: 50% 50%; overflow: hidden; background: #2a120c; touch-action: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* ---- 上の表示：願い箱の3枚と、使ったお金 ---- */
.hud { position: absolute; left: 50px; right: 8px; top: 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px; pointer-events: none; }
.slots { display: flex; align-items: center; gap: 5px; height: 36px; padding: 0 9px 0 8px; border-radius: 12px; background: var(--paper); color: var(--ink); border: 2.5px solid var(--ink); box-shadow: 0 3px 0 var(--ink); font-size: 11px; font-weight: 800; white-space: nowrap; box-sizing: border-box; }
.slots i { width: 20px; height: 20px; border-radius: 50%; box-sizing: border-box; border: 2px dashed #b9a688; display: grid; place-items: center; font-style: normal; font-size: 9px; font-weight: 900; color: var(--ink); line-height: 1; }
.slots i.on { border: 2px solid var(--ink); background: var(--c, #ddd); animation: pop .3s ease-out; }
.spent { display: flex; align-items: baseline; gap: 3px; height: 36px; padding: 0 10px; border-radius: 12px; background: var(--gold); color: var(--ink); border: 2.5px solid var(--ink); box-shadow: 0 3px 0 var(--ink); box-sizing: border-box; white-space: nowrap; }
.spent-l { font-size: 10px; font-weight: 800; align-self: center; }
.spent b { font-family: var(--logo); font-weight: 400; font-size: 21px; line-height: 34px; font-variant-numeric: tabular-nums; min-width: 1.1em; text-align: right; }
.spent-u { font-size: 12px; font-weight: 900; }
.spent.bump { animation: bump .25s ease-out; }
@keyframes bump { 30% { transform: scale(1.14) rotate(-2deg); } }
@keyframes pop { from { transform: scale(.3); } 60% { transform: scale(1.25); } to { transform: none; } }
.mute { position: absolute; left: 8px; top: 8px; width: 36px; height: 36px; border-radius: 12px; border: 2.5px solid var(--ink); background: var(--paper); color: var(--ink); box-shadow: 0 3px 0 var(--ink); display: grid; place-items: center; padding: 0; }
.mute svg { width: 19px; height: 19px; }

/* ---- タイトル ---- */
.title-panel { position: absolute; left: 14px; right: 14px; top: 52%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 9px; padding: 16px 14px 14px; border-radius: 20px; background: rgba(42, 18, 12, .93); border: 2.5px solid var(--ink); box-shadow: 0 0 0 2px var(--gold) inset, 0 8px 0 rgba(0, 0, 0, .35); text-align: center; }
.kicker { margin: 0; font-size: 13px; font-weight: 800; color: var(--gold); letter-spacing: .08em; }
.logo { margin: -4px 0 0; font-family: var(--logo); font-weight: 400; font-size: 62px; line-height: 1.1; letter-spacing: .02em; color: var(--paper); text-shadow: 0 4px 0 var(--shu), 0 7px 0 var(--ink); }
.rules { list-style: none; margin: 2px 0 0; padding: 0; display: flex; flex-direction: column; gap: 5px; width: 100%; counter-reset: r; text-align: left; font-size: 13px; font-weight: 700; line-height: 1.45; }
.rules li { counter-increment: r; position: relative; padding: 6px 8px 6px 34px; border-radius: 10px; background: var(--paper); color: var(--ink); text-wrap: pretty; }
.rules li::before { content: counter(r); position: absolute; left: 7px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; border-radius: 50%; background: var(--shu); color: #fff; font-family: var(--logo); font-size: 12px; line-height: 20px; text-align: center; }
.rules b { font-weight: 900; color: #b3280f; }
.wish-row { display: flex; flex-direction: column; gap: 3px; width: 100%; text-align: left; font-size: 12px; font-weight: 800; color: var(--dim); }
.wish-row input { height: 44px; padding: 0 12px; border-radius: 12px; border: 2.5px solid var(--ink); background: var(--paper); color: var(--ink); font-size: 16px; font-weight: 800; min-width: 0; box-sizing: border-box; -webkit-user-select: text; user-select: text; }
.wish-row input::placeholder { color: #a8957a; font-weight: 700; }
.btn { min-height: 46px; padding: 6px 14px; border-radius: 14px; border: 2.5px solid var(--ink); background: var(--paper); color: var(--ink); box-shadow: 0 4px 0 var(--ink); font-weight: 900; font-size: 15px; transition: transform .06s, box-shadow .06s, opacity .2s; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn.primary { background: var(--shu); color: #fff; }
.btn.big { width: 100%; min-height: 56px; font-family: var(--logo); font-weight: 400; font-size: 22px; letter-spacing: .08em; }
.btn:disabled { opacity: .5; cursor: default; }
.best { margin: 0; font-size: 12.5px; font-weight: 800; color: var(--gold); }
.best b { font-family: var(--logo); font-weight: 400; font-size: 16px; }

/* ---- 遊んでいる間：案内と財布 ---- */
.hint { position: absolute; left: 50%; bottom: 104px; transform: translateX(-50%); margin: 0; padding: 4px 13px; border-radius: 999px; background: rgba(29, 15, 10, .82); color: var(--paper); font-size: 12.5px; font-weight: 800; white-space: nowrap; pointer-events: none; }
.hint.pop { animation: hintPop .3s ease-out; }
@keyframes hintPop { from { transform: translateX(-50%) translateY(6px); opacity: 0; } }
.wallet { position: absolute; left: 6px; right: 6px; bottom: 8px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; padding: 7px 6px 5px; border-radius: 16px; background: #5a2f1a; border: 2.5px solid var(--ink); box-shadow: 0 0 0 2px #8a5230 inset; }
.coin-btn { position: relative; display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 0; padding: 4px 0 2px; border-radius: 11px; border: 2px solid transparent; background: transparent; color: var(--paper); transition: transform .1s, background .1s; }
.coin-btn .face { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; box-sizing: border-box; border: 2.5px solid var(--ink); background: var(--c); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .18), inset 0 2px 0 rgba(255, 255, 255, .45); font-family: var(--logo); font-size: 13px; line-height: 1; color: var(--ink); position: relative; }
.coin-btn .face.hole::after { content: ""; position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: #5a2f1a; border: 2px solid var(--ink); box-sizing: border-box; }      /* 穴は ど真ん中 */
.coin-btn .face.hole { place-items: end center; padding-bottom: 2px; font-size: 10px; }      /* 数字は穴の下 */
.coin-btn .left { font-size: 11px; font-weight: 900; line-height: 1.2; font-variant-numeric: tabular-nums; }
.coin-btn[aria-pressed="true"] { background: rgba(242, 193, 78, .22); border-color: var(--gold); transform: translateY(-4px); }
.coin-btn:disabled { opacity: .28; cursor: default; }
.coin-btn.used .face { animation: bump .2s ease-out; }

/* ---- 結果 ---- */
.result { position: absolute; left: 14px; right: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 6px; text-align: center; }
.rank-desc { margin: 0; font-size: 14px; font-weight: 800; text-wrap: balance; text-shadow: 0 2px 0 rgba(0, 0, 0, .5); }
.tally { margin: 0 0 4px; font-size: 12px; font-weight: 700; color: var(--dim); font-variant-numeric: tabular-nums; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.actions .primary { grid-column: 1 / -1; min-height: 52px; font-family: var(--logo); font-weight: 400; font-size: 19px; letter-spacing: .06em; }
.link-btn { align-self: center; min-height: 34px; padding: 4px 12px; border: 0; background: transparent; color: var(--dim); font-size: 12.5px; font-weight: 800; text-decoration: underline; text-underline-offset: 3px; }
.fade-in { animation: fadeUp .4s ease-out backwards; }
@keyframes fadeUp { from { transform: translateY(10px); opacity: 0; } }

.turn-note { position: absolute; left: 0; right: 0; top: 50px; margin: 0; text-align: center; font-size: 12px; font-weight: 800; color: var(--gold); pointer-events: none; }
.toast { pointer-events: none; position: absolute; left: 50%; top: 56px; transform: translateX(-50%); max-width: 320px; padding: 8px 14px; border-radius: 12px; background: var(--paper); color: var(--ink); border: 2.5px solid var(--ink); font-weight: 800; font-size: 12.5px; text-align: center; z-index: 5; animation: fadeUp .25s ease-out; }
@media (prefers-reduced-motion: reduce) { .slots i.on, .spent.bump, .hint.pop, .fade-in, .toast, .coin-btn.used .face { animation: none; } .btn, .coin-btn { transition: none; } }
</style>
</head>
<body>
<div id="app" data-screen="boot">
  <canvas id="cv" role="img" aria-label="神社の賽銭箱と神様"></canvas>
  <div class="hud" id="hud" hidden>
    <div class="slots" id="slots" aria-label="願い箱に入った硬貨"></div>
    <div class="spent"><span class="spent-l">使ったお金</span><b id="spent">0</b><span class="spent-u">円</span></div>
  </div>
  <button id="btnMute" class="mute" type="button" aria-label="音を消す" aria-pressed="false"></button>
  <section class="title-panel" id="pTitle" hidden>
    <p class="kicker">硬貨3枚で願いが叶う神社</p>
    <h1 class="logo">ケチ参り</h1>
    <ol class="rules">
      <li>願い箱に硬貨を<b>3枚</b>入れると、願いが叶う</li>
      <li>でも神様は、<b>500円より安い硬貨</b>をはたき落とす</li>
      <li>だまして<b>安く</b>入れよう。ただし<b>同じ手は2度通じない</b></li>
    </ol>
    <label class="wish-row" for="wish"><span>願い事（書かなくてもOK）</span>
      <input id="wish" type="text" maxlength="14" autocomplete="off" enterkeyhint="done" placeholder="例：テストで100点"></label>
    <button id="btnStart" class="btn primary big" type="button" disabled>お参りする</button>
    <p class="best" id="best" hidden></p>
  </section>
  <p class="hint" id="hint" aria-live="polite" hidden></p>
  <div class="wallet" id="wallet" role="group" aria-label="財布（投げる硬貨をえらぶ）" hidden></div>
  <section class="result" id="pResult" hidden>
    <p class="rank-desc" id="rankDesc"></p>
    <p class="tally" id="tally"></p>
    <div class="actions">
      <button id="btnSave" class="btn" type="button">画像を保存</button>
      <button id="btnShare" class="btn" type="button">シェア</button>
      <button id="btnAgain" class="btn primary" type="button">もう1回</button>
    </div>
    <button id="btnTitle" class="link-btn" type="button">願い事を書き直す</button>
  </section>
  <p class="turn-note" id="turnNote" hidden>スマホは縦向きがおすすめです</p>
  <div class="toast" id="toast" role="status" hidden></div>
</div>
<script>
'use strict';
/* ============================================================
   ケチ参り：ゲームのしくみ（硬貨・財布・神様）
   画面や音とは別にしてあるので、この部分だけで自動テストができます。
   長さの単位は「歩幅」くらいの目安：x＝左右（まん中が0）、y＝高さ、z＝奥行き（手元が0、奥ほど大きい）
   ============================================================ */
const KECHI = (() => {
  /* ---------- 調整できる数字 ---------- */
  const NEED = 3;                         // 願い箱に入れる枚数
  /* 硬貨：金額、財布に入っている枚数、見た目、神様が「安い」と見ぬくまでの遅れ（秒）。銀色の硬貨は500円玉と見分けにくいので、少し遅れる */
  const COINS = [
    { id: 'y1', v: 1, n: 5, look: 'alumi', hole: false, r: 0.085, delay: 0 },
    { id: 'y5', v: 5, n: 3, look: 'brass', hole: true, r: 0.092, delay: 0.02 },
    { id: 'y10', v: 10, n: 3, look: 'copper', hole: false, r: 0.098, delay: 0.05 },
    { id: 'y50', v: 50, n: 3, look: 'silver', hole: true, r: 0.09, delay: 0.2 },
    { id: 'y100', v: 100, n: 3, look: 'silver', hole: false, r: 0.096, delay: 0.3 },
    { id: 'y500', v: 500, n: 3, look: 'gold', hole: false, r: 0.11, delay: 0 },
  ];
  const BIG = COINS.length - 1;           // 500円玉の番号
  const GRAV = 6;                         // 重力
  const START = { x: 0, y: 0.15, z: 0 };  // 硬貨を投げ出す場所
  const NEAR = { x0: -0.66, x1: 0.66, z0: 0.7, z1: 1.4, top: 0.45 };   // 手前の箱（はじかれた硬貨が落ちる）
  const FAR = { x0: -0.58, x1: 0.58, z0: 3.3, z1: 3.9, top: 0.6 };     // 奥の箱（願い箱）
  const Z_NOTICE = 1.6;                   // 硬貨がここより奥に来ると、神様の目に入る
  const Z_GUARD = 3.0;                    // 神様の手が待ちかまえている所（願い箱のすぐ手前）
  const REACH = 0.24;                     // 手がとどく左右の幅
  const AIM = 0.55;                       // はじいた向きが、どれくらい左右のずれになるか
  const COOL = 0.22;                      // 続けて投げる時の、最低の間（秒）
  /* 鈴：神様の左上につるしてある。強くはじいた硬貨が当たると鳴って、神様がそっちを見る（1回のお参りで1度だけ）。
     r＝当たる幅　sweet＝ど真ん中の幅（当たった硬貨が、はね返ってそのまま願い箱に入る）　away＝神様が鈴を見ている秒数 */
  const BELL = { x: -0.72, y: 1.3, z: 3.4, r: 0.25, sweet: 0.07, away: 1.6 };
  /* おでこ：強くまっすぐはじいた硬貨が神様の顔に当たる。r＝おでこ（はね返って願い箱に落ちる）の幅　face＝顔（当たるだけ）の幅 */
  const HEAD = { r: 0.4, face: 0.52 };
  /* はじく強さ（1がちょうど良い）と、落ちる場所 */
  const P_NEAR = 0.62;                    // これより弱いと、手前の箱のあたりに落ちる
  const P_GOOD0 = 0.78, P_GOOD1 = 1.7;    // この間なら、願い箱までとどく。強すぎると箱をこえる
  /* 神様の本気度（願い箱に入っている枚数で上がる）：
     hands＝手の数　speed＝手の速さ　recover＝はたいた後のすき（秒）　gap＝次のあくび・よそ見までの間（秒）
     tell＝前ぶれの長さ　away＝目をはなしている長さ　fake＝「ふり」をする割合　silver＝銀色の硬貨にだまされる度合い
     いちばん下の段は、おでこに硬貨を当てられて怒った時だけ出てくる */
  const LEVELS = [
    { hands: 1, speed: 1.8, recover: 0.55, gap: [2.4, 4.2], tell: 0.5, away: 1.3, fake: 0, silver: 1 },
    { hands: 1, speed: 2.7, recover: 0.36, gap: [3.0, 5.2], tell: 0.38, away: 0.9, fake: 0.25, silver: 1 },
    { hands: 2, speed: 2.6, recover: 0.4, gap: [3.2, 5.6], tell: 0.32, away: 0.8, fake: 0.35, silver: 1 },
    { hands: 2, speed: 3.2, recover: 0.3, gap: [3.4, 5.8], tell: 0.28, away: 0.7, fake: 0.45, silver: 1 },
  ];
  const FIRST_GAP = [1.3, 2.1];           // 最初の「すき」は早めに来る（遊び方に気づけるように）
  const FAKE_HOLD = 0.3;                  // 「ふり」をしている長さ
  /* 手口：安い硬貨が願い箱に入った時の「入れ方」。once＝神様が覚えるので1回しか通じない（お金を余分に使う手口は、何回でも使える） */
  const TRICKS = {
    gap: { name: 'すき', once: true },        // あくび・よそ見のすきに入れた
    bonk: { name: 'おでこ', once: true },     // おでこに当てて、はね返りで入れた
    bell: { name: '鈴', once: true },         // 鈴を鳴らして、神様が見ているうちに入れた
    decoy: { name: 'おとり', once: false },   // ほかの硬貨で手をふさいで入れた
    silver: { name: '銀', once: false },      // 銀色の硬貨を500円玉と見まちがえさせた
    big: { name: '500', once: false },        // 500円玉をはらった
  };
  /* 称号：使ったお金がこの金額以下なら、その称号 */
  const RANKS = [
    { max: 3, name: '伝説のドケチ', desc: '1円玉3枚。これ以上は、まけられない' },
    { max: 10, name: 'ケチの神', desc: '神様より、あなたのほうが神' },
    { max: 50, name: '倹約の達人', desc: 'ワンコインにも満たないお参り' },
    { max: 350, name: 'やりくり上手', desc: '銀色の硬貨で、うまく切りぬけた' },
    { max: 600, name: 'ふつうの参拝客', desc: '最後は500円玉にたよった' },
    { max: 1200, name: '気前のいい人', desc: '神様もにっこり' },
    { max: 1e9, name: '神様のお得意さま', desc: '財布がすっかり軽くなった' },
  ];

  const clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t;
  function rng(seed) { let a = seed >>> 0 || 1; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  const rankOf = yen => RANKS.find(r => yen <= r.max);
  const TOTAL = COINS.reduce((s, c) => s + c.v * c.n, 0);

  /* ---------- はじめる ---------- */
  function newGame(seed) {
    const g = { seed: seed >>> 0 || 1, t: 0, wallet: COINS.map(c => c.n), spent: 0, thrown: 0, inCount: 0, inCoins: [], level: 0, coins: [], nextId: 1, cool: 0, done: false, doneAt: 0,
      hands: [{ x: 0, rest: 0, state: 'idle', t: 0, coin: null, wait: 0 }], att: { mode: 'watch', kind: '', t: 0, dur: 0, side: 1, fake: false }, gap: 0, silverFooled: 0, ev: [],
      inVia: [], burn: { gap: false, bonk: false, bell: false }, bell: 'ready', anger: 0,      // inVia＝入った硬貨の手口　burn＝もう通じない手口　bell＝鈴（ready → rung → gone）　anger＝おでこに当てられた回数
      count: { swat: 0, pass: 0, near: 0, ground: 0, over: 0 } };
    g.rand = rng(g.seed); g.gap = lerp(FIRST_GAP[0], FIRST_GAP[1], g.rand()); return g;
  }
  const LV = g => LEVELS[g.level];
  const say = (g, key) => g.ev.push({ type: 'say', key });

  /* ---------- 投げる ----------

      document.fonts.load('400 30px "Dela Gothic One"', GAME_TITLE + '願い箱500円未満入った！あと枚そろった−スカッ新記録?¥z0123456789カンガラど真ん中' + Object.values(VIA).map(v => v.stamp + v.shout).join('') + K.RANKS.map(r => r.name).join('')).catch(() => {}); [700, 800, 900].forEach(w => document.fonts.load(w + ' 14px "M PLUS Rounded 1c"', all).catch(() => {})); document.fonts.load('800 30px "Shippori Mincho B1"', '「」願い事がで叶った').catch(() => {}); } } catch (e) { /* 無視 */ }
  }
